apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdm-api
  namespace: pdm
  labels: {app: pdm-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: pdm-api}
  template:
    metadata:
      labels: {app: pdm-api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: pdm-api:1.0          # build with: docker build --target baked -t pdm-api:1.0 .
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: pdm-config}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: logs, mountPath: /app/logs}
      volumes:
        - name: logs
          persistentVolumeClaim: {claimName: pdm-logs}
