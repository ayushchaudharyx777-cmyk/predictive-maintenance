apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pdm-api
  namespace: pdm
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: pdm-api}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
